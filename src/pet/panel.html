<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Focus companion</title>
<style>
  :root { --bg: #0f172a; --card: #111c33; --line: #1f2b45; --text: #e2e8f0; --muted: #94a3b8; --mint: #34d399; --gold: #facc15; --red: #f43f5e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  header canvas { image-rendering: pixelated; width: 48px; height: 48px; }
  header .lvl { flex: 1; }
  header .lvl b { font-size: 16px; }
  .close { -webkit-app-region: no-drag; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
  .bar { height: 8px; background: #1e293b; border-radius: 6px; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #10b981, #6ee7b7); border-radius: 6px; transition: width .4s; }
  .bar.hp > i { background: linear-gradient(90deg, #be123c, #fb7185); }
  .bar.small { height: 5px; }
  main { flex: 1; overflow-y: auto; padding: 10px 14px 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .quest-title { font-size: 15px; font-weight: 700; }
  .next { margin-top: 8px; padding: 8px 10px; background: #0b1324; border-radius: 8px; border-left: 3px solid var(--mint); }
  .next small { display: block; color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button.act { flex: 1; border: 0; border-radius: 8px; padding: 8px; font: 600 12px "Segoe UI", sans-serif; cursor: pointer; background: #1e293b; color: var(--text); }
  button.act.primary { background: #059669; color: #fff; }
  button.act:hover { filter: brightness(1.15); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; background: #1e293b; color: var(--muted); }
  .pill.on-task { background: #064e3b; color: #6ee7b7; } .pill.drift { background: #4c0519; color: #fda4af; } .pill.away, .pill.paused { background: #1e1b4b; color: #c7d2fe; }
  .skill { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0; }
  .skill span:last-child { color: var(--muted); font-size: 12px; }
  .skill .bar { grid-column: 1 / -1; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #422006; color: var(--gold); border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats b { display: block; font-size: 18px; }
  .stats span { color: var(--muted); font-size: 11px; }
  .quest-row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .quest-row:hover { background: #16223d; }
  .quest-row.active { background: #0b2a24; outline: 1px solid #065f46; }
  .quest-row small { color: var(--muted); white-space: nowrap; }
  .muted { color: var(--muted); }
  .err { color: #fda4af; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
  <header>
    <canvas id="avatar" width="24" height="24"></canvas>
    <div class="lvl">
      <div><b id="level">Level 1</b> <span class="pill" id="state">…</span></div>
      <div class="bar"><i id="xpbar" style="width:0%"></i></div>
      <div class="muted" id="xptext"></div>
    </div>
    <button class="close" id="close" title="Close">✕</button>
  </header>
  <main>
    <section class="card" id="quest-card">
      <h3>Active quest</h3>
      <div class="quest-title" id="quest-title">No active quest</div>
      <div class="muted" id="quest-meta"></div>
      <div id="boss" style="display:none"><div class="bar hp"><i id="hpbar"></i></div><div class="muted" id="hptext"></div></div>
      <div class="next" id="next-box"><small>Next step</small><span id="next-step">—</span></div>
      <div class="row">
        <button class="act primary" id="a-done">Done ✓</button>
        <button class="act" id="a-snooze">Snooze 10m</button>
        <button class="act" id="a-pause">Pause</button>
      </div>
      <div class="err" id="err"></div>
    </section>
    <section class="card"><h3>Streak</h3><div id="streak" class="muted"></div></section>
    <section class="card"><h3>Skills</h3><div id="skills" class="muted">Finish a step to start levelling skills.</div></section>
    <section class="card"><h3>Titles</h3><div class="chips" id="titles"><span class="muted">None yet. Your first step earns one.</span></div></section>
    <section class="card"><h3>Nudges</h3><div class="stats"><div><b id="n-sent">0</b><span>sent</span></div><div><b id="n-back">0</b><span>brought you back</span></div><div><b id="n-med">–</b><span>median return</span></div></div></section>
    <section class="card"><h3>Quests</h3><div id="quests"></div><div class="row"><button class="act" id="a-import">Import JARVIS quests</button><button class="act" id="a-stats">Open stats page</button></div></section>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>pet</title>
<style>
  :root {
    --void: #07070d; --glass: rgba(9, 10, 22, .94); --line: #23264a;
    --cyan: #00f0ff; --magenta: #ff2bd6; --yellow: #f5ff3b; --red: #ff3b5c; --green: #39ff9a; --ink: #e8ecff; --muted: #8a8fbf;
    --hud: "Bahnschrift", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", "Consolas", monospace;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: var(--hud); user-select: none; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
  #stage { filter: drop-shadow(0 0 3px var(--glow, #00f0ff)) drop-shadow(0 0 10px color-mix(in srgb, var(--glow, #00f0ff) 55%, transparent)); }

  /* Speech bubble = an incoming transmission window */
  .bubble { position: absolute; box-sizing: border-box; width: 340px; display: none; color: var(--ink);
    background: var(--glass); border: 1px solid var(--accent, var(--magenta));
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 22px color-mix(in srgb, var(--accent, var(--magenta)) 45%, transparent);
    animation: boot .22s steps(4) both; }
  .bubble::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.35) 2px 3px); }
  .bubble .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font: 600 11px var(--mono); letter-spacing: .14em;
    color: var(--void); background: var(--accent, var(--magenta)); }
  .bubble .bar .blink { animation: blink 1s steps(1) infinite; }
  .bubble .body { padding: 10px 14px 12px; }
  .bubble .msg { font-size: 14px; line-height: 1.4; min-height: 20px; }
  .bubble .msg .caret { display: inline-block; width: 7px; height: 14px; margin-left: 2px; background: var(--cyan); vertical-align: -2px; animation: blink .8s steps(1) infinite; }
  .bubble .next { margin-top: 9px; padding: 7px 9px; font: 700 15px var(--hud); color: var(--cyan); background: rgba(0, 240, 255, .07); border-left: 3px solid var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,.55); }
  .bubble .next::before { content: "▶ NEXT  "; font: 600 10px var(--mono); letter-spacing: .12em; color: var(--muted); text-shadow: none; }
  .bubble .actions { display: flex; gap: 6px; margin-top: 11px; }
  .bubble .ask { display: none; gap: 6px; margin-top: 10px; }
  .bubble .ask input { flex: 1; min-width: 0; padding: 8px 9px; font: 600 14px var(--hud); color: var(--ink); background: rgba(0, 240, 255, .06); border: 1px solid var(--cyan); outline: none; caret-color: var(--cyan); }
  .bubble .ask input::placeholder { color: var(--muted); }
  .bubble .ask button { flex: none; cursor: pointer; padding: 0 14px; font: 700 12px var(--mono); letter-spacing: .1em; color: var(--void); background: var(--green); border: 0; }
  .bubble button { flex: 1; cursor: pointer; padding: 7px 4px; font: 700 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid #3a3f78;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); transition: background .12s, color .12s; }
  .bubble button:hover { background: #2a2f63; }
  .bubble button.primary { color: var(--void); background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(57,255,154,.5); }
  .bubble button.park { color: var(--yellow); border-color: var(--yellow); }
  .bubble button.park:hover { background: var(--yellow); color: var(--void); }
  .bubble .tail { position: absolute; bottom: -9px; left: var(--tail, 40px); width: 14px; height: 9px; background: var(--accent, var(--magenta)); clip-path: polygon(0 0, 100% 0, 50% 100%); }

  /* Floating rewards: neon with a chromatic glitch */
  .floater { position: absolute; white-space: nowrap; pointer-events: none; font: 800 17px var(--hud); letter-spacing: .04em; color: var(--cyan);
    text-shadow: -2px 0 rgba(255,43,214,.85), 2px 0 rgba(0,240,255,.85), 0 0 12px rgba(0,240,255,.8), 0 2px 0 #000; animation: rise 2.3s ease-out forwards; }
  .floater.big { font-size: 30px; color: var(--yellow); text-shadow: -3px 0 rgba(255,43,214,.9), 3px 0 rgba(0,240,255,.9), 0 0 18px rgba(245,255,59,.85), 0 3px 0 #000; animation: glitchrise 2.6s ease-out forwards; }
  .floater.good { color: var(--green); text-shadow: 0 0 10px rgba(57,255,154,.9), 0 2px 0 #000; }
  .floater.warn { color: var(--yellow); text-shadow: 0 0 10px rgba(245,255,59,.9), 0 2px 0 #000; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(12px) scale(.9); } 12% { opacity: 1; transform: translateY(0) scale(1.06); } 100% { opacity: 0; transform: translateY(-78px); } }
  @keyframes glitchrise { 0% { opacity: 0; transform: translate(0, 14px) skewX(0); } 8% { opacity: 1; transform: translate(-4px, 0) skewX(-12deg); } 12% { transform: translate(4px, 0) skewX(10deg); } 16% { transform: translate(0, 0) skewX(0); } 100% { opacity: 0; transform: translateY(-90px); } }
  @keyframes boot { 0% { opacity: 0; transform: scaleY(.05); } 60% { opacity: 1; transform: scaleY(1.04); } 100% { transform: scaleY(1); } }
  @keyframes blink { 50% { opacity: 0; } }
  /* Quick menu at the pet */
  .menu { position: absolute; display: none; gap: 6px; padding: 6px; background: var(--glass); border: 1px solid var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,.35);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); animation: boot .18s steps(3) both; }
  .menu button { cursor: pointer; padding: 7px 10px; font: 700 11px var(--mono); letter-spacing: .1em; color: var(--cyan); background: transparent; border: 1px solid #2a5a78; }
  .menu button:hover { background: var(--cyan); color: var(--void); }
  .menu button.stop { color: var(--red); border-color: #6a2a3a; } .menu button.stop:hover { background: var(--red); color: var(--void); }
  .offline { position: absolute; right: 12px; bottom: 6px; font: 11px var(--mono); letter-spacing: .1em; color: var(--red); display: none; text-shadow: 0 0 6px var(--red); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="bubble" id="bubble">
    <div class="bar"><span id="b-title">INCOMING // NUDGLING</span><span class="blink">●</span></div>
    <div class="body">
      <div class="msg"><span id="msg"></span><span class="caret"></span></div>
      <div class="next" id="next"></div>
      <form class="ask" id="ask" autocomplete="off"><input id="ask-in" maxlength="120" placeholder="e.g. Banafah verification"><button type="submit">GO</button></form>
      <div class="actions">
        <button class="primary" id="b-done">Done</button>
        <button class="park" id="b-park" title="Save it for later and go back">Park it</button>
        <button id="b-snooze" title="Snooze 10 minutes">Snooze</button>
        <button id="b-wrong">Wrong</button>
        <button id="b-ok" style="display:none">OK</button>
      </div>
    </div>
    <div class="tail"></div>
  </div>
  <div class="menu" id="menu">
    <button id="m-quest">QUEST</button><button data-min="25">FOCUS 25</button><button data-min="50">FOCUS 50</button><button class="stop" id="m-stop">STOP</button><button id="m-hud">HUD</button><button id="m-sound">SOUND</button><button id="m-fx">FX</button>
  </div>
  <div class="offline" id="offline">// LINK LOST — RECONNECTING</div>
  <script type="module" src="pet.js"></script>
</body>
</html>
